backend:
  name: github
  repo: Nadeemmayo/tehzeebjeweler.online
  branch: main
  base_url: https://tehzeebjeweler-cms-auth.seoinfo89.workers.dev
  auth_endpoint: auth

site_url: https://tehzeebjeweler.online
display_url: https://tehzeebjeweler.online
logo_url: https://tehzeebjeweler.online/favicon.ico

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"

    fields:
      - label: "Layout"
        name: "layout"
        widget: "hidden"
        default: "post"

      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"

      - label: "Author"
        name: "author"
        widget: "string"
        default: "Tehzeeb Jeweler Team"

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Jewelry Design"
          - "Gemstones"
          - "Collections"
          - "Jewelry Care"
          - "Trends"
          - "Craftsmanship"
          - "Gold & Silver"
          - "Diamond Guide"

      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false

      - label: "Short Description"
        name: "description"
        widget: "text"

      - label: "Meta Title"
        name: "meta_title"
        widget: "string"

      - label: "Meta Description"
        name: "meta_description"
        widget: "text"

      - label: "Focus Keyword"
        name: "focus_keyword"
        widget: "string"
        required: false

      - label: "Featured Image"
        name: "thumbnail"
        widget: "image"
        required: false

      - label: "Featured Image Alt Text"
        name: "thumbnail_alt"
        widget: "string"
        required: false

      - label: "Article Content"
        name: "body"
        widget: "markdown"
